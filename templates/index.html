<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp OTP Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1f1f20; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgb(180, 180, 180); padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #25D366; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1ebe5d; }
        .hidden { display: none; }
        .msg { text-align: center; font-size: 14px; margin-top: 10px; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <!-- Step 1: Registration Form -->
    <div id="register-section">
        <h2>Register</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="text" id="phone" placeholder="Phone (with country code, e.g., +919876543210)" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Send WhatsApp OTP</button>
        </form>
    </div>

    <!-- Step 2: OTP Verification Form -->
    <div id="otp-section" class="hidden">
        <h2>Verify OTP</h2>
        <p class="msg">Check your WhatsApp for the 6-digit verification code.</p>
        <form id="otpForm">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
            <button type="submit">Verify & Complete</button>
        </form>
    </div>
    
    <div id="status" class="msg"></div>
</div>

<script>
    let registeredPhone = "";

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        registeredPhone = phone;

        document.getElementById('status').innerText = "Sending WhatsApp OTP... Keep browser open!";

        let response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, password })
        });
        let data = await response.json();

        if (data.success) {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('otp-section').classList.remove('hidden');
            document.getElementById('status').innerText = "";
        } else {
            document.getElementById('status').innerText = data.error;
        }
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = document.getElementById('otp').value;

        let response = await fetch('/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: registeredPhone, otp })
        });
        let data = await response.json();

        if (data.success) {
            document.getElementById('status').style.color = "green";
            document.getElementById('status').innerText = "Registration Successful!";
            document.getElementById('otp-section').classList.add('hidden');
        } else {
            document.getElementById('status').style.color = "red";
            document.getElementById('status').innerText = data.error;
        }
    });
</script>

</body>
</html>
